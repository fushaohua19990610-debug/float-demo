<title>悬浮效果演示 · ビジュ爆発</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(160deg,#f2f3f7,#dde2ec); color:#23242a; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:18px 14px 26px; }
  h1 { font-size:17px; font-weight:700; letter-spacing:.5px; }
  .sub { font-size:12px; color:#7a8199; margin-top:4px; }
  #stage { width:min(78vw,340px); aspect-ratio:728/726; margin-top:26px; perspective:1100px; touch-action:none; cursor:grab; position:relative; }
  #stage:active { cursor:grabbing; }
  #groundShadow { position:absolute; left:6%; right:6%; bottom:-26px; height:44px; background:radial-gradient(ellipse at center, rgba(30,25,60,.38), rgba(30,25,60,0) 68%); border-radius:50%; filter:blur(6px); }
  #stack { position:absolute; inset:0; transform-style:preserve-3d; will-change:transform; }
  .layer { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .panel { width:min(92vw,430px); margin-top:44px; background:rgba(255,255,255,.82); border:1px solid #e2e5ee; border-radius:16px; padding:14px 16px 10px; box-shadow:0 8px 24px rgba(50,50,90,.08); }
  .row { display:flex; align-items:center; gap:10px; margin:9px 0; font-size:13px; }
  .row label { width:118px; color:#4a4f63; flex:none; }
  .row input[type=range] { flex:1; accent-color:#7b2d8b; }
  .row .val { width:52px; text-align:right; color:#7b2d8b; font-weight:600; flex:none; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  button { border:1px solid #d5d9e6; background:#fff; color:#33374a; border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; }
  button.on { background:#7b2d8b; border-color:#7b2d8b; color:#fff; }
  .layers { font-size:12px; color:#7a8199; line-height:1.9; border-top:1px dashed #e0e3ec; margin-top:10px; padding-top:8px; }
  .layers b { color:#4a4f63; font-weight:600; }
  .hint { margin-top:14px; font-size:12px; color:#9aa0b4; }
</style>

  let targetRX = -6, targetRY = 14, curRX = -6, curRY = 14;
  let dragging = false, lastX = 0, lastY = 0, spin = false, explode = false, t = 0;

  const maxTilt = () => parseFloat(tiltEl.value);
  const boost = () => explode ? 2.2 : 1;
  const h1mm = () => parseFloat(h1El.value) * boost();
  const h2mm = () => parseFloat(h2El.value) * boost();

  stage.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    targetRY = Math.max(-maxTilt(), Math.min(maxTilt(), targetRY + dx * 0.45));
    targetRX = Math.max(-maxTilt(), Math.min(maxTilt(), targetRX - dy * 0.45));
  });
  ['pointerup','pointercancel'].forEach(ev => stage.addEventListener(ev, () => dragging = false));

  function applyFloat(el, h, curRXv, curRYv){
    el.style.transform = 'translateZ(' + (h * 5.2) + 'px)';
    const shX = -curRYv * 0.55 * (0.4 + h / 10), shY = (10 + curRXv * 0.4) * (0.4 + h / 10);
    el.style.filter = 'drop-shadow(' + shX + 'px ' + (shY + 6) + 'px ' + (6 + h * 1.5) + 'px rgba(43,16,64,0.35))';
  }
  function frame(){
    t += 0.016;
    if (spin && !dragging){ targetRY += 0.55; if (targetRY > maxTilt()) targetRY = -maxTilt(); targetRX = -8 + Math.sin(t * 0.7) * 8; }
    curRX += (targetRX - curRX) * 0.12;
    curRY += (targetRY - curRY) * 0.12;
    stack.style.transform = 'rotateX(' + curRX + 'deg) rotateY(' + curRY + 'deg)';
    applyFloat(f1, h1mm(), curRX, curRY);
    applyFloat(f2, h2mm(), curRX, curRY);
    shadow.style.transform = 'translateX(' + (curRY * 0.9) + 'px) scale(' + (1 - Math.abs(curRY) / 260) + ')';
    requestAnimationFrame(frame);
  }
  frame();

  h1El.addEventListener('input', () => document.getElementById('h1Val').textContent = h1El.value + ' mm');
  h2El.addEventListener('input', () => document.getElementById('h2Val').textContent = h2El.value + ' mm');
  tiltEl.addEventListener('input', () => document.getElementById('tiltVal').textContent = tiltEl.value + '°');
  const btnE = document.getElementById('btnExplode');
  btnE.onclick = () => { explode = !explode; btnE.classList.toggle('on', explode); btnE.textContent = explode ? '合上图层' : '分开看图层'; };
  const btnS = document.getElementById('btnSpin');
  btnS.onclick = () => { spin = !spin; btnS.classList.toggle('on', spin); };
  const btnH = document.getElementById('btnHide');
  btnH.onclick = () => { const hidden = f1.style.display === 'none'; f1.style.display = f2.style.display = hidden ? '' : 'none'; btnH.classList.toggle('on', !hidden); btnH.textContent = hidden ? '隐藏悬浮层' : '显示悬浮层'; };
  document.getElementById('btnReset').onclick = () => { targetRX = -6; targetRY = 14; };
</script>
</body>
</html>
